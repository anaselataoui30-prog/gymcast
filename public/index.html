<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GYMCAST TV</title>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    body { margin: 0; background: #0b0d12; color: #e9edf5; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; overflow: hidden; }
    .box { background: #12161f; padding: 40px; border-radius: 8px; text-align: center; border-top: 5px solid #ffb02e; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 500px; width: 90%; }
    h1 { margin: 0 0 10px 0; color: #ffb02e; letter-spacing: 2px; }
    p { color: #8791a5; margin-bottom: 25px; }
    .digits { display: flex; gap: 15px; margin-bottom: 25px; justify-content: center; }
    .digit { width: 70px; height: 90px; font-size: 48px; font-weight: bold; text-align: center; background: #0c0f16; color: #ffb02e; border: 2px solid #232a3a; border-radius: 6px; }
    .digit:focus { border-color: #ffb02e; outline: none; box-shadow: 0 0 10px rgba(255,176,46,0.2); }
    button { background: #ffb02e; color: #000; border: none; padding: 16px 40px; font-size: 18px; font-weight: 800; cursor: pointer; border-radius: 4px; letter-spacing: 1px; transition: 0.2s; width: 100%; }
    button:hover { background: #ffc55e; transform: translateY(-2px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    #error { color: #ff4d3d; margin-top: 15px; min-height: 24px; font-weight: bold; }
    #player { position: fixed; top:0; left:0; width:100%; height:100%; background:black; display:none; z-index: 10; align-items: center; justify-content: center; }
    #player iframe, #player video { width: 100%; height: 100%; border: none; object-fit: contain; }
    #standby-text { color: #333; font-size: 80px; font-weight: 900; letter-spacing: 10px; }
    #paused-badge {
      position: fixed; top: 24px; left: 24px; z-index: 35; display: none;
      background: rgba(0,0,0,0.65); border: 1px solid #ffb02e66; color: #ffb02e;
      font-family: monospace; font-size: 18px; font-weight: 700; letter-spacing: 3px;
      padding: 10px 16px; border-radius: 6px; pointer-events: none;
    }
    #net-overlay {
      position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
      z-index: 36; display: none; align-items: center; gap: 14px;
      background: rgba(8,10,14,0.88); border: 1px solid; border-radius: 10px;
      padding: 12px 18px; font-family: monospace; pointer-events: none;
      box-shadow: 0 10px 30px rgba(0,0,0,.55); max-width: 92vw;
    }
    #net-overlay.down { border-color: #ff4d3d88; color: #ff4d3d; }
    #net-overlay.slow { border-color: #ffb02e88; color: #ffb02e; }
    #net-overlay.ok   { border-color: #3ddc8488; color: #3ddc84; }
    #net-title { font-size: 16px; font-weight: 800; letter-spacing: 2px; }
    #net-sub { font-size: 11px; opacity: .85; letter-spacing: 1px; margin-top: 3px; }
    .netbars { display: flex; gap: 3px; align-items: flex-end; height: 20px; flex-shrink: 0; }
    .netbars i { width: 4px; height: 20%; background: currentColor; animation: nb 1s infinite ease-in-out; border-radius: 2px; }
    .netbars i:nth-child(2){animation-delay:.15s} .netbars i:nth-child(3){animation-delay:.3s} .netbars i:nth-child(4){animation-delay:.45s} .netbars i:nth-child(5){animation-delay:.6s}
    @keyframes nb { 0%,100%{height:20%} 50%{height:100%} }
  </style>
</head>
<body>

  <div id="activation" class="box">
    <h1>GYMCAST TV</h1>
    <p>Enter the 4-digit code for this screen:</p>
    <div class="digits">
      <input class="digit" maxlength="1" type="tel" inputmode="numeric">
      <input class="digit" maxlength="1" type="tel" inputmode="numeric">
      <input class="digit" maxlength="1" type="tel" inputmode="numeric">
      <input class="digit" maxlength="1" type="tel" inputmode="numeric">
    </div>
    <button id="connectBtn">CONNECT SCREEN</button>
    <div id="error"></div>
  </div>

  <div id="player"></div>
  <div id="paused-badge">⏸ PAUSED</div>
  <div id="net-overlay">
    <span class="netbars"><i></i><i></i><i></i><i></i><i></i></span>
    <span>
      <div id="net-title"></div>
      <div id="net-sub"></div>
    </span>
  </div>

  <script>
    const LS_CODE = "gymcast_tv_code";
    const LS_TOK = "gymcast_tok";
    const LS_RST = "gymcast_rst";
    const savedCode = localStorage.getItem(LS_CODE);
    const activation = document.getElementById("activation");
    const player = document.getElementById("player");
    const pausedBadge = document.getElementById("paused-badge");
    const netOverlay = document.getElementById("net-overlay");
    const netTitle = document.getElementById("net-title");
    const netSub = document.getElementById("net-sub");
    const errorEl = document.getElementById("error");
    const digits = document.querySelectorAll(".digit");
    const connectBtn = document.getElementById("connectBtn");

    let idleDelay = 60 * 1000;
    let currentPlaylist = [];
    let currentIndex = 0;
    let ytPlayer = null;
    let htmlVid = null;
    let paused = false;
    let vol = 100;
    let audioUnlocked = false;

    // ---------- network resilience state ----------
    let netDown = false;
    let buffering = false;
    let bufferTimer = null;
    let downSince = 0;
    let downClock = null;
    let retryTimer = null;
    let probeTimer = null;
    let probing = false;
    let pollTimer = null;
    let pollFn = null;

    // ---------- schedule sync: each screen alone with the wall clock ----------
    let serverOffset = 0;
    let bestRtt = null;
    let syncEnabled = false;
    let segStart = [];
    let totalDur = 0;
    let pendingSeek = null;
    let midFixUsed = false;

    const isYTUrl = (u) => /youtube\.com|youtu\.be/i.test(u);
    const correctedNow = () => Date.now() + serverOffset;

    function fmtDur(ms) {
      const s = Math.floor(ms / 1000);
      return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    }

    function schedulePoll(delay) {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(() => { if (pollFn) pollFn(); }, delay);
    }

    function mediaIsDead() {
      const v = document.getElementById("html-vid");
      if (v) return Boolean(v.error) || v.readyState === 0;
      return !ytPlayer && currentPlaylist.length > 0;
    }

    function setNetDown(on, reason) {
      if (on === netDown) { if (on && reason) netTitle.textContent = reason; return; }
      netDown = on;
      clearTimeout(retryTimer); retryTimer = null;

      if (on) {
        clearTimeout(bufferTimer); buffering = false;
        downSince = Date.now();
        netOverlay.classList.remove("slow", "ok");
        netOverlay.classList.add("down");
        netOverlay.style.display = "flex";
        netTitle.textContent = reason || "📡 NO INTERNET — GYMCAST AUTO-RETRY";
        netSub.textContent = "the system is fine · waiting for network · 00:00";
        clearInterval(downClock);
        downClock = setInterval(() => {
          if (netDown) netSub.textContent = "the system is fine · waiting for network · " + fmtDur(Date.now() - downSince);
        }, 1000);
        if (!probeTimer) probeTimer = setInterval(() => { if (netDown) probe(); }, 60000);
      } else {
        clearInterval(downClock); downClock = null;
        if (probeTimer) { clearInterval(probeTimer); probeTimer = null; }
        netOverlay.classList.remove("slow", "down");
        netOverlay.classList.add("ok");
        netOverlay.style.display = "flex";
        netTitle.textContent = "✔ BACK ONLINE — RESUMING";
        netSub.textContent = "";
        setTimeout(() => { if (!netDown && !buffering) netOverlay.style.display = "none"; }, 3000);
        if (!paused && mediaIsDead()) playCurrent();
      }
    }

    function setBuffering(on) {
      if (on) {
        if (buffering || netDown) return;
        clearTimeout(bufferTimer);
        bufferTimer = setTimeout(() => {
          if (netDown) return;
          buffering = true;
          netOverlay.classList.remove("down", "ok");
          netOverlay.classList.add("slow");
          netOverlay.style.display = "flex";
          netTitle.textContent = "⏳ SLOW NETWORK — BUFFERING";
          netSub.textContent = "the system is fine · loading video…";
        }, 2500);
      } else {
        clearTimeout(bufferTimer);
        if (!buffering) return;
        buffering = false;
        if (!netDown) netOverlay.style.display = "none";
      }
    }

    async function probe() {
      if (probing || !netDown) return;
      probing = true;
      try {
        const res = await fetch("/api/health?r=" + Date.now(), { cache: "no-store" });
        if (res.ok) {
          setNetDown(false);
          schedulePoll(1500);
        }
      } catch (e) {}
      probing = false;
    }

    function scheduleRetry() {
      if (retryTimer || !netDown) return;
      retryTimer = setTimeout(() => {
        retryTimer = null;
        if (netDown && !paused) playCurrent();
      }, 10000);
    }

    window.addEventListener("offline", () => setNetDown(true, "📡 NO INTERNET — GYMCAST AUTO-RETRY"));
    window.addEventListener("online", () => setTimeout(probe, 2000));

    // ---------- schedule helpers ----------
    function probeDuration(url) {
      return new Promise((resolve) => {
        const el = document.createElement("video");
        el.preload = "metadata";
        el.muted = true;
        const to = setTimeout(() => { cleanup(); resolve(0); }, 8000);
        function cleanup() { clearTimeout(to); el.removeAttribute("src"); try { el.load(); } catch (e) {} }
        el.onloadedmetadata = () => { const d = el.duration; cleanup(); resolve(d); };
        el.onerror = () => { cleanup(); resolve(0); };
        el.src = url;
      });
    }

    async function loadDurations(playlist) {
      const out = {};
      for (const v of playlist) {
        if (isYTUrl(v.url)) return null;
        let cached = null;
        try { cached = JSON.parse(localStorage.getItem("gc_dur_" + v.id) || "null"); } catch (e) {}
        if (cached && cached.u === v.url && cached.d > 0) { out[v.id] = cached.d; continue; }
        const d = await probeDuration(v.url);
        if (!d || !isFinite(d) || d <= 0) return null;
        out[v.id] = d;
        try { localStorage.setItem("gc_dur_" + v.id, JSON.stringify({ u: v.url, d })); } catch (e) {}
      }
      return out;
    }

    async function setupSync(playlist) {
      syncEnabled = false;
      totalDur = 0; segStart = [];
      if (!playlist.length) return;
      const durs = await loadDurations(playlist);
      if (!durs) return;
      let acc = 0;
      for (const v of playlist) { segStart.push(acc); acc += durs[v.id]; }
      if (!(acc > 1)) return;
      totalDur = acc;
      syncEnabled = true;
    }

    function targetAt(ms) {
      const pos = ((ms / 1000) % totalDur + totalDur) % totalDur;
      let idx = 0;
      for (let i = 0; i < segStart.length; i++) if (pos >= segStart[i]) idx = i;
      return { idx, off: pos - segStart[idx] };
    }

    // Each screen follows the wall-clock schedule ALONE.
    // Behind → speed up (max 1.5x) BUT only while its buffer is healthy (>4s downloaded),
    // so a struggling screen sprints when safe and never starves itself.
    // Ahead → ease to 0.9x. In sync (±0.3s) → exactly 1x.
    // One emergency seek per video only beyond 30s (crash-scale gaps).
    function align() {
      if (!syncEnabled || paused || netDown || !htmlVid || !currentPlaylist.length) return;
      if (buffering || htmlVid.readyState < 2 || htmlVid.seeking) return;
      try {
        const t = targetAt(correctedNow());

        if (t.idx !== currentIndex) {
          currentIndex = t.idx;
          pendingSeek = t.off >= 1 ? t.off : null;
          midFixUsed = false;
          playCurrent();
          return;
        }

        const drift = t.off - htmlVid.currentTime;   // >0 = behind schedule

        if (!midFixUsed && Math.abs(drift) > 30) {
          midFixUsed = true;
          htmlVid.currentTime = Math.max(0, t.off);
          htmlVid.playbackRate = 1;
          return;
        }

        let rate = 1;
        if (drift > 0.3) {
          let ahead = 0;
          try {
            if (htmlVid.buffered && htmlVid.buffered.length) {
              ahead = htmlVid.buffered.end(htmlVid.buffered.length - 1) - htmlVid.currentTime;
            }
          } catch (e) { ahead = 0; }
          if (ahead > 4) rate = Math.min(1.5, 1 + drift * 0.15);
        } else if (drift < -0.3) {
          rate = Math.max(0.9, 1 + drift * 0.15);
        }

        if (Math.abs(htmlVid.playbackRate - rate) > 0.01) htmlVid.playbackRate = rate;
      } catch (e) {}
    }
    setInterval(align, 5000);

    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      if (htmlVid) { htmlVid.muted = false; htmlVid.volume = vol / 100; }
      if (ytPlayer && ytPlayer.unMute) { ytPlayer.unMute(); ytPlayer.setVolume(vol); }
    }
    window.addEventListener("pointerdown", unlockAudio);
    window.addEventListener("keydown", unlockAudio);

    digits.forEach((d, i) => {
      d.addEventListener("input", () => { d.value = d.value.replace(/\D/g, ''); if (d.value && i < 3) digits[i+1].focus(); });
      d.addEventListener("keydown", (e) => { if (e.key === "Backspace" && !d.value && i > 0) digits[i-1].focus(); });
    });

    if (savedCode) { activation.style.display = "none"; startPolling(savedCode); }

    connectBtn.addEventListener("click", async () => {
      const code = Array.from(digits).map(d => d.value).join("");
      if (code.length < 4) { errorEl.innerText = "Please enter all 4 digits"; return; }
      errorEl.innerText = "Connecting..."; connectBtn.disabled = true;
      try {
        const res = await fetch("/api/tv/activate", { method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({code}) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Code not found");
        localStorage.setItem(LS_CODE, code);
        activation.style.display = "none";
        startPolling(code);
      } catch(e) { errorEl.innerText = e.message; connectBtn.disabled = false; }
    });

    window.onYouTubeIframeAPIReady = function() { console.log("YT API Ready"); };

    async function startPolling(code) {
      try { document.documentElement.requestFullscreen?.(); } catch(e){}

      async function poll() {
        const t0 = (window.performance && performance.now) ? performance.now() : Date.now();
        try {
          const res = await fetch(`/api/tv/state?code=${code}&hb=1`);
          const rtt = ((window.performance && performance.now) ? performance.now() : Date.now()) - t0;

          if (res.status === 404) { localStorage.removeItem(LS_CODE); location.reload(); return; }
          if (!res.ok) throw new Error("HTTP " + res.status);

          const dh = res.headers.get("date");
          if (dh) {
            const st = Date.parse(dh);
            if (!isNaN(st)) {
              const off = st + Math.min(rtt, 4000) / 2 - Date.now();
              if (bestRtt === null || rtt <= bestRtt) {
                bestRtt = rtt;
                // Trust the device's own NTP clock unless wildly wrong (>10s).
                // This kills the per-screen ping bias (the "one screen always off" bug).
                serverOffset = Math.abs(off) > 10000 ? off : 0;
              }
            }
          }

          const data = await res.json();

          if (netDown) setNetDown(false);

          if (data.reloadToken && localStorage.getItem(LS_TOK) !== data.reloadToken) {
            localStorage.setItem(LS_TOK, data.reloadToken);
            location.reload();
            return;
          }

          if (data.resetToken && localStorage.getItem(LS_RST) !== data.resetToken) {
            localStorage.setItem(LS_RST, data.resetToken);
            localStorage.removeItem(LS_CODE);
            location.reload();
            return;
          }

          const secs = Number(data.settings && data.settings.pollSeconds);
          if (secs >= 60 && secs <= 600) idleDelay = secs * 1000;

          const incomingPlaylist = data.playlist || [];
          const incomingIds = incomingPlaylist.map(v => v.id).join(',');
          const currentIds = currentPlaylist.map(v => v.id).join(',');

          if (incomingIds !== currentIds) {
            currentPlaylist = incomingPlaylist;
            await setupSync(incomingPlaylist);
            if (syncEnabled) {
              const t = targetAt(correctedNow());
              currentIndex = t.idx;
              pendingSeek = t.off >= 1 ? t.off : null;
            } else {
              currentIndex = 0;
            }
            midFixUsed = false;
            playCurrent();
          } else if (currentPlaylist.length === 0 && player.style.display !== "flex") {
            showStandby();
          }

          applyPauseState(Boolean(data.paused));
        } catch(e) {
          console.error("Poll error", e);
          setNetDown(true);
        }

        schedulePoll(idleDelay);
      }

      pollFn = poll;
      poll();
    }

    function applyPauseState(p) {
      if (p === paused) return;
      paused = p;

      if (paused) {
        if (htmlVid) { htmlVid.pause(); htmlVid.playbackRate = 1; }
        if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
        pausedBadge.style.display = "block";
      } else {
        pausedBadge.style.display = "none";
        if (htmlVid) { htmlVid.playbackRate = 1; htmlVid.play().catch(() => {}); }
        if (ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo();
      }
    }

    function getYTId(url) {
      try {
        const u = new URL(url);
        if (u.hostname.includes("youtu.be")) return u.pathname.slice(1);
        if (u.pathname.includes("/shorts/") || u.pathname.includes("/embed/") || u.pathname.includes("/live/")) return u.pathname.split("/").pop();
        return u.searchParams.get("v");
      } catch(e) { return ""; }
    }

    function playCurrent() {
      if (currentPlaylist.length === 0) { showStandby(); return; }

      player.style.display = "block";
      const video = currentPlaylist[currentIndex];
      const isYT = isYTUrl(video.url);

      if (ytPlayer) { try { ytPlayer.destroy(); } catch(e){} ytPlayer = null; }
      if (htmlVid) { htmlVid.removeEventListener('ended', playNext); htmlVid.removeEventListener('error', onMediaError); htmlVid = null; }

      if (isYT) {
        const id = getYTId(video.url);
        player.innerHTML = '<div id="yt-player-container" style="width:100%;height:100%;"></div>';
        ytPlayer = new YT.Player('yt-player-container', {
          videoId: id,
          playerVars: { autoplay: 1, mute: 0, loop: 0, controls: 0, rel: 0, modestbranding: 1, playsinline: 1 },
          events: {
            onReady: (event) => {
              event.target.playVideo();
              event.target.unMute();
              event.target.setVolume(vol);
              if (paused) event.target.pauseVideo();
            },
            onStateChange: (event) => {
              if (event.data === YT.PlayerState.ENDED) playNext();
              else if (event.data === YT.PlayerState.PLAYING && netDown) probe();
            },
            onError: () => { if (netDown) scheduleRetry(); else playNext(); }
          }
        });
      } else {
        player.innerHTML = `<video id="html-vid" src="${video.url}" autoplay playsinline></video>`;
        htmlVid = document.getElementById("html-vid");
        htmlVid.volume = vol / 100;
        htmlVid.playbackRate = 1;
        htmlVid.addEventListener('ended', playNext);
        htmlVid.addEventListener('error', onMediaError);
        htmlVid.addEventListener('waiting', () => setBuffering(true));
        htmlVid.addEventListener('stalled', () => setBuffering(true));
        htmlVid.addEventListener('playing', () => setBuffering(false));
        htmlVid.addEventListener('canplay', () => { setBuffering(false); if (netDown) probe(); });

        if (pendingSeek != null) {
          const ps = pendingSeek; pendingSeek = null;
          htmlVid.addEventListener('loadedmetadata', () => { try { htmlVid.currentTime = ps; } catch (e) {} }, { once: true });
        }

        if (paused) {
          htmlVid.pause();
        } else {
          const p = htmlVid.play();
          if (p !== undefined) {
            p.catch(() => {
              htmlVid.muted = true;
              htmlVid.play().catch(() => {});
            });
          }
        }
      }
    }

    function onMediaError() {
      if (netDown) scheduleRetry();
      else playNext();
    }

    // Boundary: start next video naturally (no synchronized seek spikes on crowded wifi);
    // the glide catches the phase within seconds whenever the buffer allows.
    function playNext() {
      if (currentPlaylist.length === 0 || paused) return;
      if (netDown) { scheduleRetry(); return; }

      let next = (currentIndex + 1) % currentPlaylist.length;
      pendingSeek = null;

      if (syncEnabled) {
        try {
          const t = targetAt(correctedNow());
          if (t.idx !== next && t.idx !== currentIndex) {
            next = t.idx;
            pendingSeek = t.off >= 1 ? t.off : null;
          }
        } catch (e) {}
      }

      currentIndex = next;
      midFixUsed = false;
      playCurrent();
    }

    function showStandby() {
      player.style.display = "flex";
      player.innerHTML = `<div id="standby-text">STANDBY</div>`;
      pausedBadge.style.display = "none";
    }
  </script>
</body>
</html>
