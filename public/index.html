<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GYMCAST TV</title>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    body { margin: 0; background: #0b0d12; color: #e9edf5; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; overflow: hidden; }
    .box { background: #12161f; padding: 40px; border-radius: 8px; text-align: center; border-top: 5px solid #ffb02e; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 500px; width: 90%; }
    h1 { margin: 0 0 10px 0; color: #ffb02e; letter-spacing: 2px; }
    p { color: #8791a5; margin-bottom: 25px; }
    .digits { display: flex; gap: 15px; margin-bottom: 25px; justify-content: center; }
    .digit { width: 70px; height: 90px; font-size: 48px; font-weight: bold; text-align: center; background: #0c0f16; color: #ffb02e; border: 2px solid #232a3a; border-radius: 6px; }
    .digit:focus { border-color: #ffb02e; outline: none; box-shadow: 0 0 10px rgba(255,176,46,0.2); }
    button { background: #ffb02e; color: #000; border: none; padding: 16px 40px; font-size: 18px; font-weight: 800; cursor: pointer; border-radius: 4px; letter-spacing: 1px; transition: 0.2s; width: 100%; }
    button:hover { background: #ffc55e; transform: translateY(-2px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    #error { color: #ff4d3d; margin-top: 15px; min-height: 24px; font-weight: bold; }
    #player { position: fixed; top:0; left:0; width:100%; height:100%; background:black; display:none; z-index: 10; align-items: center; justify-content: center; }
    #player iframe, #player video { width: 100%; height: 100%; border: none; object-fit: contain; }
    #standby-text { color: #333; font-size: 80px; font-weight: 900; letter-spacing: 10px; }
    #paused-badge {
      position: fixed; top: 24px; left: 24px; z-index: 35; display: none;
      background: rgba(0,0,0,0.65); border: 1px solid #ffb02e66; color: #ffb02e;
      font-family: monospace; font-size: 18px; font-weight: 700; letter-spacing: 3px;
      padding: 10px 16px; border-radius: 6px; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="activation" class="box">
    <h1>GYMCAST TV</h1>
    <p>Enter the 4-digit code for this screen:</p>
    <div class="digits">
      <input class="digit" maxlength="1" type="tel" inputmode="numeric">
      <input class="digit" maxlength="1" type="tel" inputmode="numeric">
      <input class="digit" maxlength="1" type="tel" inputmode="numeric">
      <input class="digit" maxlength="1" type="tel" inputmode="numeric">
    </div>
    <button id="connectBtn">CONNECT SCREEN</button>
    <div id="error"></div>
  </div>

  <div id="player"></div>
  <div id="paused-badge">⏸ PAUSED</div>

  <script>
    const LS_CODE = "gymcast_tv_code";
    const LS_TOK = "gymcast_tok";
    const LS_RST = "gymcast_rst";
    const savedCode = localStorage.getItem(LS_CODE);
    const activation = document.getElementById("activation");
    const player = document.getElementById("player");
    const pausedBadge = document.getElementById("paused-badge");
    const errorEl = document.getElementById("error");
    const digits = document.querySelectorAll(".digit");
    const connectBtn = document.getElementById("connectBtn");

    let idleDelay = 600 * 1000;
    let currentPlaylist = [];
    let currentIndex = 0;
    let ytPlayer = null;
    let htmlVid = null;
    let paused = false;
    let vol = 100;
    let audioUnlocked = false;

    // Silent audio unlock: the first touch/click/keypress anywhere unmutes.
    // No overlay, no button, no question — it just happens.
    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      if (htmlVid) { htmlVid.muted = false; htmlVid.volume = vol / 100; }
      if (ytPlayer && ytPlayer.unMute) { ytPlayer.unMute(); ytPlayer.setVolume(vol); }
    }
    window.addEventListener("pointerdown", unlockAudio);
    window.addEventListener("keydown", unlockAudio);

    digits.forEach((d, i) => {
      d.addEventListener("input", () => { d.value = d.value.replace(/\D/g, ''); if (d.value && i < 3) digits[i+1].focus(); });
      d.addEventListener("keydown", (e) => { if (e.key === "Backspace" && !d.value && i > 0) digits[i-1].focus(); });
    });

    if (savedCode) { activation.style.display = "none"; startPolling(savedCode); }

    connectBtn.addEventListener("click", async () => {
      const code = Array.from(digits).map(d => d.value).join("");
      if (code.length < 4) { errorEl.innerText = "Please enter all 4 digits"; return; }
      errorEl.innerText = "Connecting..."; connectBtn.disabled = true;
      try {
        const res = await fetch("/api/tv/activate", { method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({code}) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Code not found");
        localStorage.setItem(LS_CODE, code);
        activation.style.display = "none";
        startPolling(code);
      } catch(e) { errorEl.innerText = e.message; connectBtn.disabled = false; }
    });

    window.onYouTubeIframeAPIReady = function() { console.log("YT API Ready"); };

    async function startPolling(code) {
      try { document.documentElement.requestFullscreen?.(); } catch(e){}

      async function poll() {
        try {
          const res = await fetch(`/api/tv/state?code=${code}&hb=1`);
          if (res.status === 404) { localStorage.removeItem(LS_CODE); location.reload(); return; }
          const data = await res.json();

          // Admin pressed "Restart": reload the page, keep the code
          if (data.reloadToken && localStorage.getItem(LS_TOK) !== data.reloadToken) {
            localStorage.setItem(LS_TOK, data.reloadToken);
            location.reload();
            return;
          }

          // Admin pressed "Reset": forget everything, back to the code screen
          if (data.resetToken && localStorage.getItem(LS_RST) !== data.resetToken) {
            localStorage.setItem(LS_RST, data.resetToken);
            localStorage.removeItem(LS_CODE);
            location.reload();
            return;
          }

          const secs = Number(data.settings && data.settings.pollSeconds);
          if (secs >= 60 && secs <= 600) idleDelay = secs * 1000;

          const incomingPlaylist = data.playlist || [];
          const incomingIds = incomingPlaylist.map(v => v.id).join(',');
          const currentIds = currentPlaylist.map(v => v.id).join(',');

          if (incomingIds !== currentIds) {
            currentPlaylist = incomingPlaylist;
            currentIndex = 0;
            playCurrent();
          } else if (currentPlaylist.length === 0 && player.style.display !== "flex") {
            showStandby();
          }

          applyPauseState(Boolean(data.paused));
        } catch(e) { console.error("Poll error", e); }

        setTimeout(poll, idleDelay);
      }

      poll();
    }

    function applyPauseState(p) {
      if (p === paused) return;
      paused = p;

      if (paused) {
        if (htmlVid) htmlVid.pause();
        if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
        pausedBadge.style.display = "block";   // show the label
      } else {
        pausedBadge.style.display = "none";    // playing: show nothing
        if (htmlVid) htmlVid.play().catch(() => {});
        if (ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo();
      }
    }

    function getYTId(url) {
      try {
        const u = new URL(url);
        if (u.hostname.includes("youtu.be")) return u.pathname.slice(1);
        if (u.pathname.includes("/shorts/") || u.pathname.includes("/embed/") || u.pathname.includes("/live/")) return u.pathname.split("/").pop();
        return u.searchParams.get("v");
      } catch(e) { return ""; }
    }

    function playCurrent() {
      if (currentPlaylist.length === 0) { showStandby(); return; }

      player.style.display = "block";
      const video = currentPlaylist[currentIndex];
      const isYT = /youtube\.com|youtu\.be/i.test(video.url);

      if (ytPlayer) { try { ytPlayer.destroy(); } catch(e){} ytPlayer = null; }
      if (htmlVid) { htmlVid.removeEventListener('ended', playNext); htmlVid.removeEventListener('error', playNext); htmlVid = null; }

      if (isYT) {
        const id = getYTId(video.url);
        player.innerHTML = '<div id="yt-player-container" style="width:100%;height:100%;"></div>';
        ytPlayer = new YT.Player('yt-player-container', {
          videoId: id,
          playerVars: { autoplay: 1, mute: 0, loop: 0, controls: 0, rel: 0, modestbranding: 1, playsinline: 1 },
          events: {
            onReady: (event) => {
              event.target.playVideo();
              event.target.unMute();          // sound ON by default
              event.target.setVolume(vol);
              if (paused) event.target.pauseVideo();
            },
            onStateChange: (event) => { if (event.data === YT.PlayerState.ENDED) playNext(); },
            onError: () => playNext()
          }
        });
      } else {
        player.innerHTML = `<video id="html-vid" src="${video.url}" autoplay playsinline></video>`;
        htmlVid = document.getElementById("html-vid");
        htmlVid.volume = vol / 100;
        htmlVid.addEventListener('ended', playNext);
        htmlVid.addEventListener('error', playNext);

        if (paused) {
          htmlVid.pause();
        } else {
          // Try FULL SOUND first. If a strict browser refuses, start muted
          // silently and unmute on the first touch/key (no prompt ever).
          const p = htmlVid.play();
          if (p !== undefined) {
            p.catch(() => {
              htmlVid.muted = true;
              htmlVid.play().catch(() => {});
            });
          }
        }
      }
    }

    function playNext() {
      if (currentPlaylist.length === 0 || paused) return;
      currentIndex = (currentIndex + 1) % currentPlaylist.length;
      playCurrent();
    }

    function showStandby() {
      player.style.display = "flex";
      player.innerHTML = `<div id="standby-text">STANDBY</div>`;
      pausedBadge.style.display = "none";
    }
  </script>
</body>
</html>
